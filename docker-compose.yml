services:

  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile

    container_name: sociosphere-app

    working_dir: /var/www

    volumes:
      - .:/var/www

    depends_on:
      - postgres
      - redis

    networks:
      - sociosphere

  nginx:
    image: nginx:alpine

    container_name: sociosphere-nginx

    ports:
      - "80:80"

    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - app

    networks:
      - sociosphere

  postgres:
    image: postgres:17

    container_name: sociosphere-postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "${DB_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - sociosphere

  redis:
    image: redis:7-alpine

    container_name: sociosphere-redis

    ports:
      - "${REDIS_PORT}:6379"

    networks:
      - sociosphere

volumes:
  postgres_data:

networks:
  sociosphere:
