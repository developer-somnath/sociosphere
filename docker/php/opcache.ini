; OPcache configuration for the CLI SAPI (php artisan serve)
; Without opcache.enable_cli=1 every request re-reads thousands of files
; from the slow Windows bind mount -> 5-13s latency.
opcache.enable=1
opcache.enable_cli=1
opcache.memory_consumption=256
opcache.max_accelerated_files=20000
; Dev-friendly: revalidate timestamps so code changes appear within ~1 minute
; (bind-mounted source). Revalidation stats all cached files, which is slow on
; a Windows bind mount, so keep the interval large. Set to 0 for production.
opcache.validate_timestamps=1
opcache.revalidate_freq=60
; Persist compiled cache to disk so restarts stay fast.
opcache.file_cache=/tmp/opcache
opcache.file_cache_only=0
